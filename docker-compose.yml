services:
  postgres:
    image: postgres:15
    container_name: expense-db
    env_file:
      - .env.docker
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

  nginx:
    image: nikosdev/expense-gateway:latest
    container_name: global-proxy
    ports:
      - "80:80"
    mem_limit: 64m
    depends_on:
      expense-app:
        condition: service_started

  alloy:
    image: grafana/alloy:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./config.alloy:/etc/alloy/config.alloy
    env_file:
      - env.alloy
    command:
      - "run"
      - "--server.http.listen-addr=0.0.0.0:12345"
      - "/etc/alloy/config.alloy"
    mem_limit: 125m
    restart: unless-stopped

  expense-app:
    image: nikosdev/expense-tracker:latest
    container_name: expense-app
    mem_limit: 512m
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    env_file:
      - .env.docker
    environment:
      - JAVA_OPTS=-Xms256m -Xmx384m
    ports:
      - "8081:8080"

volumes:
  postgres-data:
    external: true
    name: expense-manager-app_postgres-data

  rabbitmq-data:
    external: true
    name: expense-manager-app_rabbitmq-data