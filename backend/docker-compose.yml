
services:
  postgres:
    image: postgres:15
    container_name: expense-db
    env_file:
      - .env.docker
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

  expense-app:
    image: expense-tracker:latest
    container_name: expense-app
    depends_on:
      - postgres
      - rabbitmq
    env_file:
      - .env.docker
    ports:
      - "8081:8080"
volumes:
  postgres-data:
