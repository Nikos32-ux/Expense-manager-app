name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - debug/frontend-build

jobs:
  backend-build:
    name: Backend CI
    runs-on: ubuntu-latest
    steps:
      - name: Copy monorepo
        uses: actions/checkout@v2

      - name: Set up JDK
        uses: actions/setup-java@v2
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Persist mvn dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{runner.os}}-maven-${{hashFiles('**/pom.xml')}}
          restore-keys: ${{ runner.os }}-m2

      - name: Run JUnit Tests
        run: mvn -B test
        working-directory: ./backend

      - name: Build app
        run: mvn clean package -DskipTests
        working-directory: ./backend

      - name: Login to Dockerhub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Backend
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{secrets.BACKEND_IMAGE_PREFIX}}/expense-tracker:latest

  frontend-build:
    name: Frontend CI
    runs-on: ubuntu-latest
    steps:
      - name: Copy monorepo
        uses: actions/checkout@v2


      - name: Login to Dockerhub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Frontend
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{secrets.FRONTEND_IMAGE_PREFIX}}/expense-gateway:latest

  deploy:
    name: CD - Deploy through AWS Systems Manager
    needs: [ backend-build, frontend-build ]
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy to EC2 using SSM
        run: |
          aws ssm send-command \
          --document-name "AWS-RunShellScript" \
          --targets "Key=instanceIds,Values=${{ secrets.EC2_INSTANCE_ID }}" \
          --parameters 'commands=[
            "cd /home/ubuntu/prod-app",
            "echo \"${{ secrets.DOCKERHUB_TOKEN }}\" | docker login -u \"${{ secrets.DOCKERHUB_USERNAME }}\" --password-stdin",
            "docker-compose pull",
            "docker-compose down",
            "docker-compose up -d",
            "docker system prune -f"
          ]'